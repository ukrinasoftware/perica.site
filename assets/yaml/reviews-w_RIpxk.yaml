reviews:
  - name: D K
    datePublished: 09-10-2022
    body: >
      Lovely hosts! Simply the best! I'm coming here since 2006 after visiting them for the first time.
      The rooms are nice and very clean! They have everything for the basic need!
      The rooms are provided with AC, an tv , nice terras and comfortable beds.
      The beach is a 10 min walk and the area is nice and quiet. The rooms are for up to 4 persons.
      They are ideal for families. I can highly recommend to stay at Josip and Ana !
      Everything is within reach with an Walk between 5-10 minutes.
      There are plenty restaurants in the area where you can dine fine and a few bars.
      If it isn't enough, then Zadar is has plenty options left for those how are unsatisfied.
      And Zadar is only like 7km away. Great view, Quiet, Kid-friendly, Great value
    rating: 5
